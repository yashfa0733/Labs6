<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Smart Billing</title><link rel="stylesheet" href="css/style.css"></head><body><main><header><small>WEB TECHNOLOGIES · LAB 05</small><h1>Smart Billing System</h1><p>Create an invoice and calculate discount, tax and total.</p></header><section><h2>Add product</h2><form id="form"><label>Product name<input id="name" required></label><label>Price (Rs.)<input id="price" type="number" min="0.01" step=".01" required></label><label>Quantity<input id="qty" type="number" min="1" step="1" value="1" required></label><button>Add item</button></form><p id="msg"></p></section><section><h2>Invoice <small id="meta"></small></h2><table><thead><tr><th>Product</th><th>Price</th><th>Qty</th><th>Total</th><th></th></tr></thead><tbody id="rows"></tbody></table><div class="totals"><label>Discount Rs. <input id="discount" type="number" min="0" value="0"></label><label>Tax % <input id="tax" type="number" min="0" max="100" value="5"></label><p>Subtotal <b id="subtotal">0</b></p><p>Tax <b id="taxamt">0</b></p><h3>Grand total <b id="total">0</b></h3></div><button id="print">Print invoice</button><button id="clear" class="gray">Clear</button></section></main><script src="js/app.js"></script></body></html>
